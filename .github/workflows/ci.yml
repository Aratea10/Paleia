name: CI

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    backend:
        name: Backend
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: backend

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up uv and Python
              uses: astral-sh/setup-uv@v10.2.0
              with:
                  version: "0.12.17"
                  python-version: "3.12"
                  working-directory: backend

            - name: Sync dependencies
              run: uv sync --locked

            - name: Check application import
              run: uv run python -c "from paleia.main import app; assert app is not None"

            - name: Compile Python sources
              run: uv run python -m compileall src

    frontend:
        name: Frontend
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build
