name: Bug report
description: Report incorrect or unexpected behavior in Paleia.
labels:
  - "type: bug"

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is going wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe how to reproduce the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happens instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Add relevant operating system, browser, Python, Node.js, or other environment information.
      placeholder: |
        - OS:
        - Browser:
        - Python:
        - Node.js:
        - Paleia version/commit:
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs, screenshots, affected documents, or any other useful information.
    validations:
      required: false
